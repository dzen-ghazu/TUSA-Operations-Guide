site_name: TUSA Operations Guide
site_description: Internal documentation, workflows, and standard operating procedures.
site_author: TUSA IT Team
site_url: https://dzen-ghazu.github.io/TUSA-Operations-Guide/ # Update with your deployment URL if applicable

# Repository configuration (Update with your actual GitHub repo info)
repo_name: TUSA / Operations Guide
edit_uri: edit/main/docs/

extra_css:
  - stylesheets/extra.css
  
# Theme configuration (Using Material for MkDocs)
theme:
  name: material
  language: en
  palette:
    # Palette toggle for automatic dark/light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-3
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.path
    - navigation.top
    - navigation.tracking
    - search.highlight

# Extensions for advanced Markdown formatting
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

